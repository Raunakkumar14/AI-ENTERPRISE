# A generic, single database configuration.

[alembic]
# ─────────────────────────────────────────────────────────────────────────────
# This URL is overridden at runtime by env.py reading from app.config.settings
# so you can leave it as a placeholder here.
# ─────────────────────────────────────────────────────────────────────────────
script_location = alembic

# Location of migration version scripts
version_locations = %(here)s/alembic/versions

# File template for new migration scripts
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration file timestamps
timezone = UTC

# Max length of the "slug" in the generated filename
truncate_slug_length = 40

# ── Logging ──────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
